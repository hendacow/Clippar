# Full EAS builds (binary, ~10-15 min). Triggered automatically on push to
# main as the fallback for OTA delivery — OTAs have been unreliable, so
# every merge fires a fresh preview build and you install via the EAS URL.
#
# Build quota note: EAS free tier allows ~30 builds/month. The path filter
# only triggers on actual code changes (clippar_app/**) — docs, root-level
# workflow edits, and config files don't burn a build.
#
# Manual override: skip auto-build by including `[skip build]` in the
# commit message. Useful for trivial doc/config-only merges.

name: CI/CD (Full EAS Build)

on:
  push:
    branches: [main]
    paths:
      - 'clippar_app/**'
      - '!clippar_app/**.md'
      - '!clippar_app/.github/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - staging
          - production

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    # Allow skipping via commit message — for trivial merges
    if: "!contains(github.event.head_commit.message, '[skip build]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clippar_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clippar_app/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  build:
    # Auto-builds (push) use `preview`. workflow_dispatch uses the input.
    name: Build (${{ github.event.inputs.profile || 'preview' }})
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clippar_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clippar_app/package-lock.json
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build ${{ github.event.inputs.profile || 'preview' }}
        run: eas build --profile ${{ github.event.inputs.profile || 'preview' }} --platform ios --non-interactive --no-wait
