# Full EAS builds (binary, ~10-15 min) — for native changes that can't be
# OTA'd. Most JS-only fixes go through eas-update.yml instead.
#
# DISABLED FOR NOW: the auto-triggers (push to main / staging) are commented
# out because:
#   1. Native changes are infrequent enough that manual dispatch is fine
#   2. Free-tier EAS builds are slow (~15-30 min queue + 10 min build)
#   3. We're still validating the staging tier; don't want to burn quota
# Re-enable the `push:` block when you're ready for fully auto staging/prod
# builds on every push.

name: CI/CD (Full EAS Build)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - staging
          - production
  # Re-enable when ready:
  # push:
  #   branches: [main, staging]
  #   paths:
  #     - 'clippar_app/**'
  #     - '!clippar_app/**.md'
  # pull_request:
  #   branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clippar_app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clippar_app/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  build:
    name: Build (${{ github.event.inputs.profile }})
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clippar_app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clippar_app/package-lock.json
      - run: npm ci
      # SHA-pinned, not @v8. This step is handed EXPO_TOKEN — an EAS account
      # access token — so whoever controls what `v8` resolves to gets code
      # execution in a job holding the credential that can `eas update --branch
      # production`, i.e. push an OTA to every App Store install. EAS Update code
      # signing is not enabled, so nothing downstream would catch it. A tag is a
      # mutable pointer; a commit SHA is not.
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          # Pinned rather than `latest` for the same reason: `latest` is whatever
          # npm serves at run time.
          eas-version: 21.4.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build ${{ github.event.inputs.profile }}
        run: eas build --profile ${{ github.event.inputs.profile }} --platform ios --non-interactive --no-wait
