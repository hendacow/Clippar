# EAS Update (OTA) — publishes a JS-only over-the-air update to installed
# Clippar builds so changes reach the app without a new EAS build.
#
# Triggers on push to main when JS or asset files change. Native edits (Swift,
# Pods, iOS project) are intentionally excluded because OTA can't ship native
# code — those still need a full `eas build`.
#
# Promotion model (matches `eas.json` channels):
#   default push to main → preview channel  → updates your daily "Clippar"
#                                              internal install (built from
#                                              `preview` profile)
#   workflow_dispatch with branch=development → updates "Clippar Dev" build
#                                              (your dev client install)
#   workflow_dispatch with branch=staging → updates "Clippar Staging" build
#                                              (TestFlight beta, when set up)
#   workflow_dispatch with branch=production → updates "Clippar" App Store build
#                                              (PUBLIC users — only run when intentional)
#
# Required repo secret: EXPO_TOKEN
#   Create at https://expo.dev/settings/access-tokens (or `eas account:create-access-token`)
#   Add at https://github.com/hendacow/Clippar/settings/secrets/actions

name: EAS Update (OTA)

on:
  push:
    branches: [main]
    paths:
      - 'clippar_app/**'
      # Exclude paths that can't be OTA'd — native code requires a rebuild
      - '!clippar_app/ios/**'
      - '!clippar_app/android/**'
      - '!clippar_app/modules/**/ios/**'
      - '!clippar_app/modules/**/android/**'
      - '!clippar_app/Podfile'
      - '!clippar_app/Podfile.lock'
      - '!clippar_app/.github/**'
      - '!clippar_app/**.md'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update branch (matches eas.json channel)'
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - staging
          - production
      message:
        description: 'Optional release notes for this update'
        required: false
        type: string

jobs:
  publish-update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clippar_app
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          # Need parent commit so we can build a meaningful release message
          # from `git log` — depth 2 is enough.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clippar_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Resolve update parameters
        id: params
        run: |
          # Default to "preview" for automatic push-to-main runs — this matches
          # the channel that the existing "Clippar" internal install on Henry's
          # phone listens to. Switch to "staging" once a staging build/Supabase
          # is installed and ready to receive beta updates.
          BRANCH="${{ github.event.inputs.branch || 'preview' }}"
          # Prefer the manual input message; otherwise use the commit subject.
          MESSAGE="${{ github.event.inputs.message }}"
          if [ -z "$MESSAGE" ]; then
            MESSAGE="$(git log -1 --pretty=%s)"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"
          echo "Publishing to EAS branch: $BRANCH"
          echo "Message: $MESSAGE"

      - name: Publish update
        id: publish
        # Pass branch + message through env vars rather than ${{ ... }}
        # interpolation. Direct interpolation of a commit subject that
        # contains quote characters (e.g. PR title `Rename "X" to "Y"`)
        # breaks the shell quoting and treats parts of the message as args.
        # Env-var passthrough means the shell handles escaping correctly.
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          UPDATE_BRANCH: ${{ steps.params.outputs.branch }}
          UPDATE_MESSAGE: ${{ steps.params.outputs.message }}
        run: |
          # Restrict to iOS for now. Default --platform=all bundles web too,
          # which triggers static rendering of expo-router routes — that loads
          # lib/supabase.ts and fails with "supabaseUrl is required" because
          # EXPO_PUBLIC_SUPABASE_URL isn't in GitHub Actions env. We don't
          # deploy web anywhere yet, so skipping it is fine. When we add web
          # or android targets, change to `--platform=all` AND add the
          # required EXPO_PUBLIC_* secrets to the repo.
          eas update \
            --branch "$UPDATE_BRANCH" \
            --platform=ios \
            --message "$UPDATE_MESSAGE" \
            --non-interactive

      # Ping Slack so we know the moment a fix actually goes live. Skipped
      # gracefully if SLACK_WEBHOOK_URL secret isn't set yet (e.g. first
      # workflow run before the user wires up the webhook).
      - name: Notify Slack
        if: success() && env.SLACK_WEBHOOK_URL != ''
        # Same env-passthrough pattern as the Publish step so quote chars
        # in the commit message don't break the JSON payload assembly.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          UPDATE_BRANCH: ${{ steps.params.outputs.branch }}
          UPDATE_MESSAGE: ${{ steps.params.outputs.message }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          # Build the payload with jq so quote chars in $UPDATE_MESSAGE are
          # JSON-escaped correctly instead of breaking the wire format.
          PAYLOAD=$(jq -n \
            --arg branch "$UPDATE_BRANCH" \
            --arg sha "$SHORT_SHA" \
            --arg message "$UPDATE_MESSAGE" \
            --arg workflow "$WORKFLOW_URL" \
            '{ text: ":rocket: *OTA update published* — `\($branch)` channel\n• Commit: `\($sha)`\n• Message: \($message)\n• Workflow: \($workflow)\nApp will fetch this on next launch." }')
          curl -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
