name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # SHA-pinned, not a tag. These jobs run with repository write access and
        # a Claude OAuth token; a moved tag on a third-party action is arbitrary
        # code execution inside them. Tags are mutable pointers, commit SHAs are
        # not. Resolved via the GitHub API, dereferencing the annotated tag
        # object to its commit.
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Use Opus 4.7 for the @claude flow — Henry is usually not at his Mac
          # when this runs, so the model needs to get changes right first try
          # rather than ping-ponging through "regenerate the PR" cycles. Cost is
          # the same since the OAuth token routes through his Claude Max sub.
          claude_args: '--model claude-opus-4-7'

