name: CI

# Keeps main green: runs the verify gate (typecheck + tests) and the edge-function
# gate on every PR into main and on pushes to main.
#
# The secret scan used to live here and now has its own workflow
# (.github/workflows/secret-scan.yml), because these triggers are wrong for it.
# The reasoning that removed the `paths:` filter — a scan that can be routed
# around is not a scan — applies with equal force to the BRANCH filter below: a
# credential pushed on any branch with no open PR into main was never looked at.
# The typecheck and edge-function gates only need to protect main, so they stay.
#
# NOTE: deliberately no `paths:` filter here either. The extra minutes on
# web-only changes are cheap.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: clippar_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clippar_app/package-lock.json
      # postinstall runs patch-package (re-applies the RNVM + expo-camera patches)
      - run: npm ci
      - run: npm run verify

  edge-functions:
    name: edge function typecheck + tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # clippar_app/tsconfig.json EXCLUDES supabase/functions (they use https:
      # imports tsc cannot resolve), so `npm run verify` has never covered the
      # backend. Without this a broken — or unguarded — edge function ships green.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Typecheck edge functions
        working-directory: clippar_app
        run: |
          for f in supabase/functions/*/index.ts supabase/functions/_shared/*.ts; do
            case "$f" in *.test.ts) continue ;; esac
            [ -f "$f" ] || continue
            # --node-modules-dir=none: the Stripe types pulled in by
            # create-payment-intent and stripe-webhook reference @types/node, and
            # Deno v2 auto-detects clippar_app/package.json and then insists on a
            # populated node_modules to resolve it. These functions import only
            # https: specifiers, so there is nothing for Deno to resolve there.
            # Without this the job fails on a machine that has not run npm ci —
            # and passes on one that has, which is exactly how it hid locally.
            deno check --quiet --node-modules-dir=none "$f"
          done
      - name: Test edge functions
        working-directory: clippar_app
        # Dummy values: importing a function module constructs its service-role
        # client at top level and createClient throws on an undefined URL before
        # any test body runs. They only have to parse.
        env:
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-key
        run: deno test --allow-env --node-modules-dir=none supabase/functions/
