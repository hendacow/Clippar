name: secret scan

# Runs on EVERY branch, deliberately, and that is the whole point of splitting it
# out of ci.yml.
#
# ci.yml triggers on `push: branches: [main]` and `pull_request: branches: [main]`.
# That is right for a typecheck gate and wrong for a secret scan, for exactly the
# reason ci.yml already gives about `paths:` filters: a scan that can be routed
# around is not a scan. A branch filter routes around it completely — push a
# credential on any branch with no open PR into main and nothing looks at it, for
# as long as nobody opens one. On a public repository the blob is world-readable
# from the moment of the push.
#
# That is not a hypothetical gap. It is the shape of a real incident in this
# repository: the scan reported CLEAN because it never ran on the refs involved.
#
# What this buys and what it does not: running on push only DETECTS. It turns a
# silent, open-ended exposure into a red build within a minute, which is the
# difference between rotating on day 0 and finding out much later. It cannot stop
# the push. The only thing that does is local — the ignore rules, plus a pre-push
# hook running this same script.
on:
  push:
    # BOTH filters are required, and `branches: ['**']` alone is a trap that
    # reads as "every ref". It is not: once `push` carries a `branches` filter,
    # GitHub runs the workflow for branch pushes ONLY and skips tag pushes
    # outright (workflow syntax, on.<push>.<branches|tags|…>). So a tag pushed
    # at a commit that is on no branch — `git push origin <sha>:refs/tags/x` —
    # publishes the blob on a public repository while the all-ref scan never
    # fires. That is the same routed-around hole this file was split out of
    # ci.yml to close, reached through a ref type instead of a branch name.
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: secret + endpoint scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to immutable commit SHAs, never to tags. A tag is
      # movable by whoever publishes the action, so `@v4` is "whatever that
      # account points it at today" — and the workflows in this repo hand
      # third-party actions the EAS release token. See eas-update.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: a key that was committed and then deleted is still a
          # leaked key, and a shallow clone cannot see it. The scan is meaningless
          # without this — it searches almost nothing and prints CLEAN, which is
          # indistinguishable from a real pass.
          fetch-depth: 0
      - name: Scan for secrets and non-production endpoints
        run: ./scripts/secret-scan.sh
